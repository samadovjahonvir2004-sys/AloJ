name: AloJ APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aloj-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/android/sdk/ndk/2[0-6]* || true
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android NDK and tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Build AloJ
        env:
          ALOJ_API_HASH: ${{ secrets.ALOJ_API_HASH }}
          ALOJ_KEY_PASSWORD: ${{ secrets.ALOJ_KEY_PASSWORD }}
        run: bash ci/build.sh

      - name: Collect log
        if: always()
        run: |
          mkdir -p out
          tail -n 400 build.log > out/build-tail.log 2>/dev/null || echo "no log" > out/build-tail.log
          [ -f out/status ] || echo FAILED > out/status
          echo "${{ github.sha }}" > out/commit

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          FILES="out/AloJ.apk"
          [ -f out/AloJ-old-phones.apk ] && FILES="$FILES out/AloJ-old-phones.apk"
          gh release create "$TAG" $FILES --title "AloJ ${TAG}" --notes "AloJ build ${TAG} (Nagram asosida)" --repo "${{ github.repository }}"

      - name: Push result to builds branch
        if: always()
        run: |
          cd out
          rm -f AloJ-old-phones.apk
          git init -q
          git config user.name "aloj-bot"
          git config user.email "aloj-bot@users.noreply.github.com"
          git checkout -q -b builds
          git add -A
          git commit -q -m "build ${{ github.run_number }}: $(cat status)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
