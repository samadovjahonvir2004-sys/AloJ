name: AloJ APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_COMMIT: 21f7d109da6ab3506c9e9577f98c6a38771ab335

concurrency:
  group: aloj-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /

      - uses: actions/checkout@v4

      - name: Get Telegram source and apply AloJ patch
        run: |
          git clone --depth 1 https://github.com/DrKLO/Telegram.git src
          cd src
          git fetch --depth 1 origin "$UPSTREAM_COMMIT"
          git checkout -q "$UPSTREAM_COMMIT"
          git submodule update --init --recursive --depth 1 --jobs 8 || git submodule update --init --recursive --jobs 8
          git apply ../aloj.patch
          echo "Patch applied"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check secrets
        env:
          ALOJ_API_HASH: ${{ secrets.ALOJ_API_HASH }}
          ALOJ_KEY_PASSWORD: ${{ secrets.ALOJ_KEY_PASSWORD }}
        run: |
          if [ -z "$ALOJ_API_HASH" ] || [ -z "$ALOJ_KEY_PASSWORD" ]; then
            echo "Secrets ALOJ_API_HASH and ALOJ_KEY_PASSWORD must be set in Settings > Secrets > Actions" | tee build.log
            exit 1
          fi

      - name: Install Android NDK and tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: Build APK
        working-directory: src
        env:
          ALOJ_API_HASH: ${{ secrets.ALOJ_API_HASH }}
          ALOJ_KEY_PASSWORD: ${{ secrets.ALOJ_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            :TMessagesProj_App:assembleAfatRelease --stacktrace 2>&1 | tee ../build.log

      - name: Collect output
        if: always()
        run: |
          mkdir -p out
          tail -n 400 build.log > out/build-tail.log 2>/dev/null || echo "no log" > out/build-tail.log
          APK=$(find src/TMessagesProj_App/build/outputs/apk -name "*.apk" | head -1 || true)
          if [ -n "$APK" ]; then cp "$APK" out/AloJ.apk; echo "OK" > out/status; else echo "FAILED" > out/status; fi
          echo "${{ github.sha }}" > out/commit
          ls -la out

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" out/AloJ.apk --title "AloJ ${TAG}" --notes "AloJ test build ${TAG}" --repo "${{ github.repository }}"

      - name: Push result to builds branch
        if: always()
        run: |
          cd out
          git init -q
          git config user.name "aloj-bot"
          git config user.email "aloj-bot@users.noreply.github.com"
          git checkout -q -b builds
          git add -A
          git commit -q -m "build ${{ github.run_number }}: $(cat status)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
